[project]
name = "spherex-flipbook"
version = "0.1.0"
description = "SPHEREx Flipbook: enter an RA and Dec, watch the sky change between visits"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "astropy>=6.0",
  "scipy>=1.12",
  "pyarrow>=15",
  "duckdb>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]
science = ["reproject", "photutils", "healpy"]

[tool.setuptools]
packages = ["contracts", "backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "contracts"]
markers = ["slow: needs network (validation suite)"]
addopts = "-m 'not slow'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
per-file-ignores = { "contracts/__init__.py" = ["F401", "F403"], "scripts/*" = ["E501", "E702"] }
