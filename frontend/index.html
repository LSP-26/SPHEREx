<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A multi-epoch viewer for NASA SPHEREx near-infrared images: compare any patch of sky across survey passes to find moving and variable objects." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151515" />
    <script>
      // apply a stored Light/Dark choice before the first paint (see ThemeToggle.tsx)
      try { var t = localStorage.getItem("tombaugh-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b1a19'/%3E%3Ccircle cx='6' cy='8' r='1.6' fill='%23fff'/%3E%3Ccircle cx='10.5' cy='8' r='1.6' fill='%23fff' opacity='.45'/%3E%3C/svg%3E" />
    <title>Tombaugh</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
